<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - M/S Mulla Agro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        form p {
            margin-bottom: 1rem;
        }
        form label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }
        form input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            outline: none;
            transition: all 0.2s;
        }
        form input:focus {
            border-color: #16A34A;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }
        form ul.errorlist {
            color: #DC2626;
            font-size: 0.8rem;
            list-style-type: disc;
            margin-left: 1.2rem;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen py-10">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-extrabold text-green-700 mb-6 text-center">লগইন করুন</h2>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-lg font-bold mt-4 hover:bg-green-700 shadow transition duration-200">
                Login
            </button>
        </form>
        
        <p class="text-sm text-center text-gray-600 mt-6">
            অ্যাকাউন্ট নেই? 
            <a href="{% url 'signup' %}" class="text-green-600 font-bold hover:underline">Sign Up করুন</a>
        </p>
    </div>

</body>
</html>
